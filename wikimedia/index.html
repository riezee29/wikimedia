<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wikimedia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="header">
    <a class="logo" href="#/">Wikimedia</a>
    <form id="search-form" role="search">
      <input id="search-input" type="search" placeholder="Search Wikimedia" autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </header>

  <div id="layout">
    <nav id="sidebar">
      <h3>Navigation</h3>
      <ul>
        <li><a href="#/">Main page</a></li>
        <li><a href="#/special/recent">Recent changes</a></li>
        <li><a href="#/special/random">Random page</a></li>
        <li><a href="#/special/all">All pages</a></li>
      </ul>
      <h3>Tools</h3>
      <ul>
        <li><a href="#/edit/New_page" id="new-page-link">Create a page</a></li>
        <li><a href="#" id="whatlinkshere-link">What links here</a></li>
      </ul>
    </nav>

    <main id="content">
      <div id="tabs"></div>
      <h1 id="page-title"></h1>
      <div id="body"></div>
      <div id="categories"></div>
      <div id="footer-note"></div>
    </main>
  </div>

  <script src="js/store.js"></script>
  <script src="js/markup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
